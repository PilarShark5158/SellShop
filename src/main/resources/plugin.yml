name: SellShop
version: '1.0'
main: fr.worldfarm.sell.Main
api-version: '26.2'
depend: [Vault]
softdepend: [MoneyEconomy]

commands:
  sell:
    description: Ouvre le menu de vente
    usage: /sell
    permission: sellshop.sell
  prix:
    description: Affiche le prix de l'objet en main
    usage: /prix
    permission: sellshop.prix

permissions:
  sellshop.sell:
    description: Utilisation de /sell
    default: true
  sellshop.prix:
    description: Utilisation de /prix
    default: true
  sellshop.admin:
    description: Utilisation de /sell reload
    default: op
