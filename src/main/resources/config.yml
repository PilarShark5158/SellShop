# Symbole affiché après les montants
devise: "$"

menu:
  titre-vente: "&8Vendre des objets"
  titre-confirmation: "&8Confirmer la vente ?"
  bouton-nom: "&6&lVendre &7(&e{total}{devise}&7)"
  bouton-lore:
    - ""
    - "&7Objets vendables : &f{items}"
    - "&7Total : &e{total}{devise}"
    - ""
    - "&aClique pour vendre"
  confirmer-nom: "&a&lConfirmer la vente"
  confirmer-lore:
    - "&7Tu vas vendre &f{items} objet(s)"
    - "&7pour &e{total}{devise}"
  annuler-nom: "&c&lAnnuler"
  annuler-lore:
    - "&7Tes objets te seront rendus"
  info-nom: "&6Total : &e{total}{devise}"
  info-lore:
    - "&7Objets : &f{items}"

# Lignes ajoutées sur les objets vendables DANS le menu /sell
lore-prix:
  - ""
  - "&7Prix : &e{prix}{devise} &7/ pièce"
  - "&7Pile : &6{pile}{devise}"

messages:
  prefix: "&6[Vente] "
  vente: "{prefix}&aTu as vendu &e{items} objet(s) &apour &6{total}{devise}&a."
  rien-a-vendre: "{prefix}&cAucun objet vendable dans le menu."
  annule: "{prefix}&7Vente annulée, tes objets t'ont été rendus."
  erreur-economie: "{prefix}&cErreur avec l'économie, vente annulée."
  vente-trop-grosse: "{prefix}&cLe montant est trop élevé, vends en plusieurs fois."
  prix-objet: "{prefix}&f{objet} &7: &e{prix}{devise} &7/ pièce &8| &7pile ({quantite}) : &6{pile}{devise}"
  prix-aucun: "{prefix}&cCet objet ne peut pas être vendu."
  main-vide: "{prefix}&cTiens un objet en main."
  joueur-seulement: "&cCette commande est réservée aux joueurs."
  reload: "{prefix}&aConfiguration et prix rechargés."
  pas-permission: "&cTu n'as pas la permission."
