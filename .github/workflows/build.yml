name: Build SellShop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compiler
        run: mvn -B clean package

      - name: Publier le jar
        uses: actions/upload-artifact@v4
        with:
          name: SellShop-jar
          path: target/SellShop-1.0.jar
